<script type="text/javascript">
    Ext4.onReady(function (){
        EHR.Security.init({
            scope: this,
            success: function(){
                var webpart = <%=webpartContext%>;
                var ctx = EHR.Utils.getEHRContext(webpart.wrapperDivId);
                if(!ctx)
                    return;

                Ext4.define('EHR.panel.VetAssignmentToolsPanel', {
                    extend: 'Ext.panel.Panel',

                    initComponent: function(){
                        Ext4.apply(this, {
                            itemId: 'outerPanel',
                            border: false,
                            defaults: {
                                border: false
                            },
                            items: [{
                                width: 1000,
                                items: [{
                                    html:'  <h3>Vet Assignment Tools</h3>
                                            <ul>
                                                <li><a href="/query/ONPRC/EHR/executeQuery.view?schemaName=study&query.queryName=demographicsAssignedVet&query.AssignedVet~contains=Unassigned">NHPs Without an Assigned Vet</a></li>
                                                <li><a href="/query/ONPRC/EHR/executeQuery.view?schemaName=study&query.queryName=vetAssignmentFilter">Vet Assignment Raw Data</a></li>
                                                <!-- <li><a href="/query/ONPRC/EHR/executeQuery.view?schemaName=study&amp;query.queryName=ProtocolswithNoVetAssigned">Protocols with no vet assigned</a></li> -->
                                                <li><a href="/query/ONPRC/EHR/executeQuery.view?schemaName=ehr&amp;query.queryName=project&amp;query.viewName=Active%20Projects&amp;query.use_category~neqornull=Research">Resource Projects</a></li>
                                                <li><a href="/issues/ONPRC/Admin/IS/ISE%20Issues%20and%20Training/Issues/details.view?issueId=4305">Vet Assignment Change Log</a></li>
                                                <li><a href="/query/ONPRC/EHR/executeQuery.view?schemaName=study&query.queryName=vetAssignment_projects">Active Animal Assignments to Projects</a></li>
                                            </ul>
                                            <h3>Vet Assignment Hierarchy</h3>
                                            <p>Vets are assigned to NHPs according to the first rule listed below that matches.</p>
                                            <ol start="0">
                                                <li>Open Case</li>
                                                <li>Room Priority</li>
                                                <li>Area Priority</li>
                                                <li>Project Room Research Priority</li>
                                                <li>Project Room Resource Priority</li>
                                                <li>Project Room Research</li>
                                                <li>Project Room Resource</li>
                                                <li>Project Area Research Priority</li>
                                                <li>Project Area Resource Priority</li>
                                                <li>Project Area Research</li>
                                                <li>Project Area Resource</li>
                                                <li>Project Research Priority</li>
                                                <li>Project Resource Priority</li>
                                                <li>Project Research</li>
                                                <li>Project Resource</li>
                                                <li>Protocol Room Priority</li>
                                                <li>Protocol Area Priority</li>
                                                <li>Protocol Room</li>
                                                <li>Protocol Area</li>
                                                <li>Protocol Priority</li>
                                                <li>Protocol</li>
                                                <li>Room</li>
                                                <li>Area</li>
                                            </ol>',

                                    style: 'padding-bottom: 20px;',
                                    border: false
                                },]
                            },]
                        });

                        this.callParent(arguments);

                        this.on('afterrender', function(panel){
                            this.originalWidth = Math.max(this.getWidth(), Ext4.getBody().getWidth());
                        }, this);
                    },

                    doResize: function(itemWidth){
                        var width2 = this.getWidth();
                        if (itemWidth > width2){
                            this.setWidth(itemWidth);
                            this.doLayout();
                        }
                        else if (itemWidth < width2) {
                            if (this.originalWidth && width2 != this.originalWidth){
                                this.setWidth(Math.max(this.originalWidth, itemWidth));
                                this.doLayout();
                            }
                        }
                    }
                });

                Ext4.create('EHR.panel.VetAssignmentToolsPanel', {

                }).render(webpart.wrapperDivId);
            }
        });
    });
</script>
