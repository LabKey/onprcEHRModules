<style>
    .hiddenEl {
        display: none;
    }

    .errorMsg {
        color: #C04044;
    }

    body {
        font-family: Arial, sans-serif;
        margin: 20px;
    }

    .post-search {
        border-top: 1px solid #ccc;
        padding: 20px 0 10px 0;
    }

    .snomed-section {
        padding: 16px 0 20px 0;
        margin-bottom: 10px;
        display: inline-block;
    }

    .snomed-section label {
        display: inline-block;
        margin-right: 10px;
    }

    .snomed-section input[type="text"] {
        width: 500px;
        margin-right: 10px;
    }

    .snomed-section button:hover {
        background-color: #0056b3;
    }

</style>

<script type="text/javascript" nonce="<%=scriptNonce%>">

    const searchBySubset = false;
    let codeInProgress;

    function onEdit() {
        document.getElementById("createSnomed").style.display = "none";
        document.getElementById("addSnomed").style.display = "none";

        document.getElementById("postSearch").innerHTML = "";
        document.getElementById("postSearch").hidden = true;

        document.getElementById("results").innerHTML = "";
        document.getElementById("showMessage").innerHTML = "";
        codeInProgress = undefined;
    }

    function showMessage(msg, error) {
        document.getElementById("showMessage").innerHTML = msg;
        if (error) {
            document.getElementById("showMessage").className = "errorMsg";
        }
        else {
            document.getElementById("showMessage").className = "";
        }
    }

    function postSearch(msg) {
        document.getElementById("showMessage").innerHTML = msg;
        if (error) {
            document.getElementById("showMessage").className = "errorMsg";
        }
        else {
            document.getElementById("showMessage").className = "";
        }
    }

    function addSnomed() {

        const subset = "Organisms";
        const row = {code: codeInProgress, subset: subset};

        LABKEY.Query.saveRows({
            containerPath: LABKEY.container.id,
            commands: [{
                schemaName: 'ehr_lookups',
                queryName: 'snomed_subset_codes',
                command: 'insert',
                rows: [row]
            }],
            scope: this,
            method: 'POST',
            success: function (response) {
                if (response?.result?.[0]?.rows?.[0]?.code)
                {
                    showSnomed(response.result[0].rows[0].code, true);
                }
                showMessage("SNOMED code added to " + subset + ".", false);

                codeInProgress = undefined;
            },
            failure: LABKEY.Utils.getCallbackWrapper((response) => {
                showMessage(response.exception, true);
                codeInProgress = undefined;
            })
        });
    }

    function createSnomed() {

        // TODO: change to subset if supporting subset dropdown
        // const subset = document.getElementById("subsetOptions").value;
        const subset = "Organisms";

        const snomed = document.getElementById("snomed").value;

        LABKEY.Ajax.request({
            url: LABKEY.ActionURL.buildURL("onprc_ehr", "saveSnomed"),
            method: 'POST',
            jsonData: {
                subset: subset,
                snomed: snomed
            },
            timeout: 100000,
            success: LABKEY.Utils.getCallbackWrapper((response) => {
                if (response.status === "success" && response.code) {
                    showMessage("SNOMED code added.", false);
                    showSnomed(response.code, true);
                }
                else if (response.status === "SNOMED exists")
                {
                    const postSearch = document.getElementById("postSearch");
                    postSearch.innerHTML = `<br><p>A SNOMED with this meaning already exists. Would you like to add it to the subset '${subset}'?</p>`;
                    postSearch.hidden = false;

                    showSnomed(response.code, false);

                    document.getElementById("createSnomed").style.display = "none";
                    document.getElementById("addSnomed").style.display = "block";
                    codeInProgress = response.code;
                }
                else {
                    showMessage(response.status);
                }
            }),
            failure: LABKEY.Utils.getCallbackWrapper((response) => {
                showMessage(response.exception, true);
            })
        });
    }

    function showSnomed(code, showFinal) {
        document.getElementById("results").innerHTML = "";

        if (showFinal) {
            document.getElementById("postSearch").innerHTML = "";
            document.getElementById("postSearch").hidden = true;

            document.getElementById("createSnomed").style.display = "none";
            document.getElementById("addSnomed").style.display = "none";
        }

        new LABKEY.QueryWebPart({
            renderTo: 'results',
            title: 'SNOMED Code',
            schemaName: 'ehr_lookups',
            queryName: 'snomed_summary',
            filters: [LABKEY.Filter.create('code', code, LABKEY.Filter.Types.EQUALS)]
        });
    }

    function searchSnomed() {

        const subset = "Organisms";
        // const subset = document.getElementById("subsetOptions").value;
        const snomed = document.getElementById("snomed").value;

        onEdit();

        LABKEY.Ajax.request({
            url: LABKEY.ActionURL.buildURL("onprc_ehr", "getSnomed"),
            method: 'POST',
            jsonData: {
                subset: searchBySubset ? subset : undefined,
                snomed: snomed
            },
            timeout: 100000,
            success: LABKEY.Utils.getCallbackWrapper((response) => {
                const snomeds = response.snomeds;
                const results = document.getElementById("results");
                results.innerHTML = "";

                const postSearch = document.getElementById("postSearch");

                if (snomeds.length === 0) {
                    postSearch.innerHTML = `<br><p>No matches found. Click the Create button to create this as a new SNOMED code for the ${subset} subset.</p>`;
                    postSearch.hidden = false;
                }
                else {

                    postSearch.innerHTML = `<p>${snomeds.length} potential current SNOMED match${snomeds.length > 1 ? 'es' : ''} found. If you still want to create the SNOMED for the ${subset} subset, click the Create button.</p>`;
                    postSearch.hidden = false;

                    new LABKEY.QueryWebPart({
                        renderTo: 'results',
                        title: 'Possible SNOMED Matches',
                        schemaName: 'ehr_lookups',
                        queryName: 'snomed_summary',
                        filters: [LABKEY.Filter.create('code', snomeds.join(';'), LABKEY.Filter.Types.EQUALS_ONE_OF)]
                    });
                }

                document.getElementById("createSnomed").style.display = "block";
            }),
            failure: LABKEY.Utils.getCallbackWrapper((response) => {
                showMessage(response.exception, true);
            })
        });
    }

    (function getSubsets() {
        LABKEY.Query.selectRows({
            schemaName: 'ehr_lookups',
            queryName: 'snomed_subsets',
            columns: 'subset',
            scope: this,
            error: LDK.Utils.getErrorCallback(),
            success: function(results){
                if (!results.rows || !results.rows.length){
                    showMessage('SNOMED Subsets Not Found.', true);
                    return;
                }

                const subsetDropdown = document.getElementById("subsetOptions");
                subsetDropdown.innerHTML = "";

                results.rows.forEach((row) => {
                    let option = document.createElement("option");
                    option.value = row.subset;
                    option.text = row.subset;
                    subsetDropdown.appendChild(option);
                });

                document.getElementById("loadingPage").style.display = "none";
                document.getElementById("mainPage").style.display = "block";
            }
        });
    })();

    LABKEY.Utils.onReady(function(){
        document.getElementById('searchSnomed')['onclick'] = function(){ searchSnomed(); return false; }
        document.getElementById('createSnomed')['onclick'] = function(){ createSnomed(); return false; }
        document.getElementById('addSnomed')['onclick'] = function(){ addSnomed(); return false; }
        document.getElementById('snomed')['onchange'] = function(){ onEdit(); return false; }
        document.getElementById('subsetOptions')['onchange'] = function(){ onEdit(); return false; }
    });

</script>
<div id="loadingPage">
    <span class="fa fa-spinner fa-pulse"></span> Loading...
</div>
<div id="mainPage" class="hiddenEl">
    <div class="hiddenEl">
        <label for="subsetOptions">Subset:</label>
        <select id="subsetOptions" name="subset">
            <option>Loading...</option>
        </select>
        <br><br>
    </div>
    <div class="snomed-section">
        <label for="snomed">Meaning:</label>
        <input type="text" id="snomed" name="snomed" />
        <button id="searchSnomed">Search</button>
    </div>
    <div class="post-search" id="postSearch" hidden="hidden"></div>
    <button id="createSnomed" class="hiddenEl">Create Organism</button>
    <button id="addSnomed" class="hiddenEl">Add Organism</button>
    <br>
    <div id="showMessage"></div>
    <br>
    <div id="results"></div>
</div>
