                                var panel = this.up('#sheetPanel');
                                var field = panel.down('#animalField');

                                var val = field.getValue() || [];


                            if (val){
                                val = Ext4.String.trim(val);
                                val = val.replace(/[\s,;]+/g, ';');
                                val = val.replace(/(^;|;$)/g, '');

                                val = val ? val.split(';') : [];
                            }

                            if (!val){
                                Ext4.Msg.alert('Error', 'Must enter at least one animal Id');
                                return;
                            }
                            value = Ext4.isArray(val) ? val: [val];

                            if (!val)
                                return;

                            const params = {};
                            if (!Ext4.isEmpty(value))
                                params.AnimalID = val;

                            return ONPRC.Utils.getSsrsReportUrl('Clinical/WeightSheetsID',
                                    ONPRC.Utils.getSsrsParams(params, true, true));
                        },
                        menu: [{
                            text: 'Print',
                            handler: function(menu){
                                var btn = menu.up('button');
                                var url = btn.getUrlString();
                                if (!url)
                                    return;

                                window.open(url);
                            }
                        },{
                            text: 'Print To PDF',
                            handler: function(menu){
                                var btn = menu.up('button');
                                var url = btn.getUrlString();
                                if (!url)
                                    return;

                                url += '&rs:Format=PDF';
                                window.open(url);
                            }
                        }]
                    },{
                        html: ''
                    },{
                        html: '<hr>',
                        style: 'padding-top: 10px;',
                        colspan: 4
                    },{
                        html: '<i>Room Utilization / Layout:</i>',
                        width: 200
                    },{
                        style: 'margin-left: 5px;',
                        xtype: 'checkbox',
                        fieldLabel: 'Invert C/D Rows?',
                        labelWidth: 140,
                        itemId: 'doInvertRows',
                        checked: false
                    },{
                        xtype: 'button',
                        style: 'margin-left: 5px;',
                        text: 'Print Version',
                        itemId: 'roomBtn',
                        border: true,
                        getUrlParams: function(){
                            var panel = this.up('#sheetPanel');
                            var area = panel.down('#areaField').getValue();
                            var rooms = panel.down('#roomField').getValue();
                            if (Ext4.isEmpty(area) &&  Ext4.isEmpty(rooms)){
                                Ext4.Msg.alert('Error', 'Must provide a room or area');
                                return;
                            }

                            var params = {
                                doRowInversion: panel.down('#doInvertRows').getValue() ? 1 : 0
                            };
                            if (!Ext4.isEmpty(area))
                                params.area = area;
                            if (!Ext4.isEmpty(rooms))
                                params.rooms = rooms;

                            return params;
                        },
                        handler: function(btn){
                            var params = btn.getUrlParams();
                            if (!params)
                                return;

                            if (params.area){
                                delete params.rooms;
                            }

                            var url = LABKEY.ActionURL.buildURL('onprc_ehr', 'printRoom', null, params);
                            window.open(url);
                        }
                    },{
                        xtype: 'button',
                        style: 'margin-left: 5px;',
                        text: 'Online Version',
                        border: true,
                        handler: function(btn){
                            var urlParams = {schemaName: 'ehr_lookups', 'query.queryName': 'roomUtilization'};
                            var params = btn.up('#sheetPanel').getParams(true) || {};
                            if (params.Areas){
                                urlParams['query.room/area~in'] = params.Areas.join(';');
                            }
                            else if (params.Rooms){
                                urlParams['query.room~in'] = params.Rooms.join(';');
                            }

                            var url = LABKEY.ActionURL.buildURL('query', 'executeQuery', null, urlParams);
                            window.open(url);
                        }
                    }]
                });

                return items;
            },

            getParams: function(suppressErrors, skipRoomsIfAllSelected, roomSeparator) {
                var params = {};

                var roomField = this.down('#roomField');
                var rooms = roomField.getValue() || [];
                rooms = Ext4.isArray(rooms) ? rooms: [rooms];

                if (!rooms.length && !suppressErrors){
                    Ext4.Msg.alert('Error', 'Must select an area or room');
                    return false;
                }

                //NOTE: we now include both area + rooms if supplied.  we rely on the combos to be smart about turning
                //off area if the user picked a set of rooms that differs from the definition
                //if all rooms are selected, treat this the same as if no rooms are selected
                if (rooms.length){
                    if (!skipRoomsIfAllSelected || rooms.length < roomField.store.getCount()){
                        params.Rooms = roomSeparator ? rooms.join(roomSeparator) : rooms;
                    }
                }

                return params;
            },

            getAnimalHistoryHash: function(reportName){
                var params = this.getParams(true) || {};

                var ret = '#showReport:1&activeReport:' + reportName;
                if (params.Rooms){
                    ret += '&inputType:roomCage&room:' + params.Rooms.join(',')
                }
                else {
                    ret += '&inputType:none'
                }

                return ret;
            }
        });

        Ext4.create('ONPRC.panel.PrintableReportsPanel', {

        }).render(webpart.wrapperDivId);
    });

</script>
